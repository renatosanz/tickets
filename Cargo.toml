[package]
name = "tickets"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
log = "0.4.33"
simple_logger = "5.2.0"
chrono = { version = "0.4", features = ["serde"] } 
regex = "1"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio","postgres", "sqlite", "chrono"] }
